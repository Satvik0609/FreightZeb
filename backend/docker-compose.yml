version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: freightzeb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-freightzeb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightzeb_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-freightzeb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightzeb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightzeb_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           5000
      DATABASE_URL:   postgresql://${POSTGRES_USER:-freightzeb}:${POSTGRES_PASSWORD:-freightzeb_secret}@postgres:5432/${POSTGRES_DB:-freightzeb}?schema=public
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost:3000}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://localhost:8000}
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_SECURE:    ${SMTP_SECURE:-false}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      SMTP_FROM:      ${SMTP_FROM:-noreply@freightzeb.com}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── DB Migration runner (runs once then exits) ───────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightzeb_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freightzeb}:${POSTGRES_PASSWORD:-freightzeb_secret}@postgres:5432/${POSTGRES_DB:-freightzeb}?schema=public
    command: ["npx", "prisma", "db", "push"]
    restart: "no"

volumes:
  postgres_data:
  uploads_data:
  logs_data:
