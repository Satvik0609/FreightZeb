version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: freightzen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-freightzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightzen_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-freightzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightzen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  # ── ML Service ─────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml/service
      dockerfile: Dockerfile
    container_name: freightzen_ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-service-key}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED:   "1"
    volumes:
      - ./ml/service/saved_models:/app/saved_models
    healthcheck:
      # Use /readyz so healthcheck only passes when models are loaded
      test: ["CMD", "curl", "-f",
             "-H", "X-ML-API-Key: ${ML_SERVICE_API_KEY:-dev-ml-service-key}",
             "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g

  # ── DB Migration (runs once, then exits) ───────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightzen_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-freightzen}:${POSTGRES_PASSWORD:-freightzen_secret}@postgres:5432/${POSTGRES_DB:-freightzen}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  # ── Express API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightzen_api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV:           production
      PORT:               5000
      DATABASE_URL:       postgresql://${POSTGRES_USER:-freightzen}:${POSTGRES_PASSWORD:-freightzen_secret}@postgres:5432/${POSTGRES_DB:-freightzen}?schema=public
      ML_SERVICE_URL:     http://ml-service:8000
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-service-key}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres_data:
  uploads_data:
  logs_data:
