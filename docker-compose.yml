version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: freightzen-db
    environment:
      POSTGRES_USER: freightzen
      POSTGRES_PASSWORD: freightzen123
      POSTGRES_DB: freightzen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightzen"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: freightzen-ml
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightzen-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://freightzen:freightzen123@postgres:5432/freightzen
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freightzen-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
